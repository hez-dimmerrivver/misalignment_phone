<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>p5.js test</title>

  <!-- iOS Web App full screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- top bar -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="p5.js裝置">

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.js"></script>
  <style>
    * {
      touch-action: none;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #test-ui {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 20px;
      border-radius: 20px;
      color: white;
      display: flex;
      gap: 15px;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 100;
    }
    #test-ui label {
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div id="test-ui">
    <label>
      <input type="checkbox" id="sim-switch" checked>
      Power Switch
    </label>
    <label>
      Potentiometer:
      <input type="range" id="sim-pot" min="0" max="4095" value="2048">
    </label>
  </div>

<script>
  let socket;
let ipInput, connectBtn;

// 接收 ESP32 傳來的狀態
let jammingState = 0; // 0 或 1
let spoofingVal = 0;  // 0 ~ 4095

function setup() {
  createCanvas(600, 400);

  // 建立 IP 輸入框與連線按鈕
  createSpan('ESP32 IP: ');
  ipInput = createInput('192.168.1.100'); // 改成你的 ESP32 實際 IP
  ipInput.position(80, 10);
  
  connectBtn = createButton('Wi-Fi 連線');
  connectBtn.position(240, 10);
  connectBtn.mousePressed(initWebSocket);
}

function draw() {
  background(30);

  // 1. 開關視覺範例
  if (jammingState === 1) {
    fill(255, 50, 50);
  } else {
    fill(80);
  }
  rect(100, 100, 100, 50, 10);
  
  fill(255);
  textSize(20);
  textAlign(CENTER, CENTER);
  text(jammingState ? "JAMMING" : "OFF", 150, 125);

  // 2. 滑桿視覺範例 (0 ~ 4095 對應到 畫面寬度)
  let barWidth = map(spoofingVal, 0, 4095, 0, width - 200);
  
  fill(50, 200, 255);
  rect(100, 200, barWidth, 30);
  
  noFill();
  stroke(255);
  rect(100, 200, width - 200, 30);

  // 數值顯示
  noStroke();
  fill(255);
  textAlign(LEFT);
  textSize(16);
  text(`SPOOFING Value: ${spoofingVal}`, 100, 260);
}

// 💡 建立 WebSocket 連線
function initWebSocket() {
  let ip = ipInput.value();
  let wsUrl = `ws://${ip}:81`; // WebSocket 連接 ESP32 的 81 Port

  console.log("Connecting to " + wsUrl);
  socket = new WebSocket(wsUrl);

  socket.onopen = function() {
    console.log("Connected via Wi-Fi!");
  };

  socket.onmessage = function(event) {
    try {
      let data = JSON.parse(event.data);
      jammingState = data.sw;
      spoofingVal = data.pot;
    } catch (e) {
      console.error("JSON Error", e);
    }
  };

  socket.onclose = function() {
    console.log("Disconnected from ESP32");
  };
}
</script>
</body>
</html>
